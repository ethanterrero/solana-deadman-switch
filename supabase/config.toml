# Supabase CLI config for the reminder notifier (project: deadman-switch-reminders).
# Functions are deployed via MCP/dashboard; this exists for local-CLI parity
# (`supabase functions serve`) and to pin verify_jwt to match production.

project_id = "evwzkclqfjypefxglylc"

# reminder-tick is gated by the x-cron-secret header, not a JWT.
[functions.reminder-tick]
verify_jwt = false

# subscribe is gated by an on-chain owner check, not a JWT (public + CORS).
[functions.subscribe]
verify_jwt = false
